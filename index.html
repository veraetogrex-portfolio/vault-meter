<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Vault Meter — veraetogrex_portfolio</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Vault Meter · zero dependencies · github.com/veraetogrex-portfolio -->
  <div class="flood" aria-hidden="true"></div>
  <div class="sweep" aria-hidden="true"><i></i></div>

  <main class="vault-meter">
    <p class="kicker">Settings · Security</p>
    <h1 class="title">Create a password</h1>

    <div class="field">
      <input id="password" type="text" spellcheck="false" autocomplete="new-password" placeholder="New password" maxlength="40" aria-label="New password" aria-describedby="crack">
      <button class="eye" type="button" aria-label="Hide password">
        <svg class="eye-on" viewBox="0 0 24 24"><path d="M2 12s3.6-6.5 10-6.5S22 12 22 12s-3.6 6.5-10 6.5S2 12 2 12z"/><circle cx="12" cy="12" r="3"/></svg>
        <svg class="eye-off" viewBox="0 0 24 24"><path d="M3 3l18 18M10.6 5.6A10.6 10.6 0 0 1 12 5.5c6.4 0 10 6.5 10 6.5a17 17 0 0 1-3.2 3.9M6.1 6.9C3.4 8.6 2 12 2 12s3.6 6.5 10 6.5c1.6 0 3-.4 4.2-1"/></svg>
      </button>
    </div>

    <section class="meter" aria-live="polite">
      <svg class="art" viewBox="0 0 330 330" aria-hidden="true">
        <filter id="glow" x="-20%" y="-20%" width="140%" height="140%"><feGaussianBlur stdDeviation="3.2" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
        <g filter="url(#glow)"></g>
      </svg>
      <div class="readout">
        <div class="level"><p class="level-name">No lock</p></div>
        <div class="segs"><i></i><i></i><i></i><i></i></div>
        <p class="crack" id="crack">Nothing to crack yet</p>
        <p class="note">Estimate · 10B guesses/s offline</p>
        <p class="chips"><span data-c="lower">a-z</span><span data-c="upper">A-Z</span><span data-c="digit">0-9</span><span data-c="sym">#!-</span></p>
      </div>
      <p class="bits"><b>0</b> bits</p>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
